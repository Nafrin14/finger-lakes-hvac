<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Finger Lakes HVAC & R Inc.</title>
    <script>
      // GitHub Pages SPA redirect
      // Encodes the full path into a query param so index.html can restore it
      var segmentCount = 1; // matches the repo depth: /finger-lakes-hvac/
      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + segmentCount).join('/') + '/?p=/' +
        l.pathname.slice(1).split('/').slice(segmentCount).join('/').replace(/&/g, '~and~') +
        (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body></body>
</html>
